name: Release

# Every push to master (i.e. every merged pull request) produces a new GitHub release.
# A push trigger is used on purpose: unlike `pull_request: closed` it also gets a
# write-enabled token when the PR was opened by Dependabot.
on:
  push:
    branches: [ "master" ]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so existing tags are available

      - name: Create the next tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The pull request that produced this commit (merge, squash or rebase).
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "No pull request is associated with $GITHUB_SHA (direct push) - skipping release."
            exit 0
          fi
          number=$(jq -r '.number' <<< "$pr")
          title=$(jq -r '.title' <<< "$pr")
          labels=$(jq -r '.labels[].name' <<< "$pr")

          # Tags look like v.<major>.<minor>.<feature>.<fix>; start from v.1.0.0.0 when none exist.
          last=$(git tag --list 'v.*' --sort=-v:refname | head -n 1)
          last=${last:-v.1.0.0.0}
          IFS=. read -r _ a b c d <<< "$last"

          # PRs labelled "enhancement" bump the feature number, everything else bumps the fix number.
          if grep -qx enhancement <<< "$labels"; then
            c=$((c + 1)); d=0
          else
            d=$((d + 1))
          fi
          tag="v.$a.$b.$c.$d"

          # Release notes: PR description + link, then GitHub's auto-generated changelog.
          {
            jq -r '.body // ""' <<< "$pr"
            printf '\n\nPull request: #%s\n' "$number"
          } > notes.md

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag - $title" \
            --notes-file notes.md \
            --generate-notes
